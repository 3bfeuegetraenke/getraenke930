<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- nicht in Suchmaschinen aufnehmen -->
<title>Getränke 930</title>
<!-- Home-Bildschirm: eigenes Symbol (Adler auf Gelb) und Name -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Getränke 930">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2b2d32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #2b2d32; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Die eigentliche App (Google Apps Script) wird hier eingebettet. Diese Seite liefert nur Symbol und Namen. -->
<iframe id="app" title="Getränke 930" allow="clipboard-write"></iframe>
<script>
(function () {
  // Adresse der Strichliste (fester Link der Google-Web-App)
  var APP = 'https://script.google.com/macros/s/AKfycbwuDuKgFbsFaBBf26or3FQM5YdIgHMUcLJV3OLOMSs7V2-H9dZst23OrBnceam4swOE/exec';
  var KEY = 'g930_p';
  var q = new URLSearchParams(location.search);
  try {
    // Persönlichen Link merken, wenn er aus der App kommt („Persönlichen Link öffnen“ → neu=1).
    // Android startet ein installiertes Symbol ohne die Link-Teile – dann nimmt die Seite den gemerkten Link.
    if (q.get('p') && q.get('neu') === '1') localStorage.setItem(KEY, q.get('p'));
    if (!q.get('p') && !q.get('admin')) {
      var p = localStorage.getItem(KEY);
      if (p) q.set('p', p);
    }
  } catch (e) { /* ohne Speicher geht es auch, dann eben über den Link */ }
  var s = q.toString();
  document.getElementById('app').src = APP + (s ? '?' + s : '');
  // „Abmelden“ in der App → gemerkten persönlichen Link vergessen
  window.addEventListener('message', function (e) {
    if (!/^https:\/\/[\w.-]+\.googleusercontent\.com$/.test(e.origin)) return;
    if (e.data === 'g930-abmelden') { try { localStorage.removeItem(KEY); } catch (x) { /* ignorieren */ } }
  });
})();
</script>
</body>
</html>
